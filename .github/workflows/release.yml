name: Release

# Builds the distributable Thock binaries.
#
#   * `workflow_dispatch` — build only; the bundles land as run artifacts,
#     which is how you smoke-test a change to the bundling scripts.
#   * pushing a `v*` tag — build, draft a GitHub Release holding the same
#     bundles, publish them to the update channel, and only then publish the
#     release, so a channel that names a release always names a reachable one.
#
# The bundle steps read THOCK_GOOGLE_CLIENT_ID / THOCK_GOOGLE_CLIENT_SECRET
# from repository secrets so the shipped app can sign in to Google without the
# user supplying their own OAuth client (see `crates/thock/src/google_auth.rs`).
# Both are compiled in; a build without them still works, but Google sync stays
# unavailable until the vault supplies a `[google]` override.
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Nothing downstream symbolicates these builds, and the debug info alone
  # exceeds the free space on a hosted runner.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  # Ship on the stable channel so the bundles poll for updates; the committed
  # RELEASE_CHANNEL file stays `dev` so local builds never do. The bundle
  # scripts write this through to crates/zed/RELEASE_CHANNEL before building.
  ZED_RELEASE_CHANNEL: stable

jobs:
  # A tag ships to every installed app, so it has to be a commit that is on
  # main, passed CI, and carries the version the tag names. Checked before the
  # forty-minute builds rather than after them. A manual run builds whatever
  # it is pointed at and publishes nothing, so it skips the checks.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -1)"
          [ "v${crate}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match crates/zed/Cargo.toml ${crate}" >&2
            exit 1
          }

      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main" >&2
            exit 1
          }

      - name: CI passed on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The merge that bumped the version may still be in CI when the tag
          # is pushed; wait for it rather than making the tag a two-step dance.
          for _ in $(seq 60); do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')"
            [ "${conclusion}" = "pending" ] || break
            sleep 30
          done
          [ "${conclusion}" = "success" ] || {
            echo "the CI check on ${GITHUB_SHA} is '${conclusion}', not success" >&2
            exit 1
          }

  macos:
    name: macOS (aarch64)
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin

      # Only a run on main or on a tag can write a cache a tag build restores,
      # and pushing either already means being able to ship; the cache saves
      # most of an hour.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: release-macos
          cache-all-crates: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          package-manager-cache: false

      # `script/bundle-mac` signs and notarizes only when all five Apple secrets
      # are present, and falls back to an ad-hoc signature otherwise — so a
      # partial set silently produces an unsigned bundle that still passes here.
      # MACOS_SIGNING_IDENTITY is a repository variable rather than a secret: it
      # is stamped into every shipped binary anyway, and masking it in the log
      # would only make a codesign failure harder to read.
      - name: Bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          THOCK_GOOGLE_CLIENT_ID: ${{ secrets.THOCK_GOOGLE_CLIENT_ID }}
          THOCK_GOOGLE_CLIENT_SECRET: ${{ secrets.THOCK_GOOGLE_CLIENT_SECRET }}
        run: script/bundle-mac aarch64-apple-darwin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thock-macos-aarch64
          path: target/aarch64-apple-darwin/release/Thock-aarch64.dmg
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: .github/scripts/free-disk-space.sh

      - name: Install Linux dependencies
        run: script/linux

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 # zizmor: ignore[cache-poisoning]
        with:
          key: release-linux
          cache-all-crates: true

      # Ubuntu's `llvm` package installs versioned binaries; `script/bundle-linux`
      # calls the unversioned name.
      - name: Ensure llvm-objcopy is on PATH
        run: |
          if ! command -v llvm-objcopy >/dev/null; then
            # shellcheck disable=SC2012
            objcopy_path="$(ls -1 /usr/lib/llvm-*/bin/llvm-objcopy | sort -V | tail -1)"
            sudo ln -sf "$objcopy_path" /usr/local/bin/llvm-objcopy
          fi
          llvm-objcopy --version

      # `script/bundle-linux` exports CC but not CXX, so webrtc-sys' C++ would
      # otherwise build with g++, which rejects webrtc's `Network()` declaration
      # ("changes meaning of 'Network'"); the -Wno-changes-meaning it passes
      # only exists in GCC 14+ and is ignored on this runner.
      - name: Bundle
        env:
          CXX: clang++
          THOCK_GOOGLE_CLIENT_ID: ${{ secrets.THOCK_GOOGLE_CLIENT_ID }}
          THOCK_GOOGLE_CLIENT_SECRET: ${{ secrets.THOCK_GOOGLE_CLIENT_SECRET }}
        run: script/bundle-linux

      # `script/bundle-linux` also emits a remote_server archive; Thock does not
      # ship remote development, so it stays out of the release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thock-linux-x86_64
          path: target/release/thock-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # Drafted rather than published: `publish-updates` publishes it once the
      # channel names it, so a failed run never leaves a public release that
      # installed apps are not offered.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Thock ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*

  # Publishes the artifacts and channel manifest that installed apps poll
  # (spec: thock/specs/v20-auto-update.md §11). Guarded on the GCP repository
  # variables so tags keep building before the infrastructure exists — the job
  # then reports as skipped, not green.
  publish-updates:
    name: Publish update channel
    if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_RELEASES_BUCKET != ''
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the draft release once the channel is flipped
      id-token: write # Workload Identity Federation; no key in secrets
    env:
      BUCKET: ${{ vars.GCP_RELEASES_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts, merge-multiple: true }

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build the manifest
        run: |
          thock/services/releases/write-manifest "${GITHUB_REF_NAME}" artifacts > manifest.json
          cat manifest.json

      # Immutable, and first: no manifest may name a URL that doesn't resolve yet.
      - name: Upload artifacts
        run: |
          gcloud storage cp artifacts/* manifest.json \
            "gs://${BUCKET}/dist/${GITHUB_REF_NAME}/" \
            --cache-control="public, max-age=31536000, immutable"

      # The one write that changes what an installed app sees.
      - name: Flip the stable channel
        run: |
          gcloud storage cp \
            "gs://${BUCKET}/dist/${GITHUB_REF_NAME}/manifest.json" \
            "gs://${BUCKET}/channels/stable.json" \
            --cache-control="no-store"
          echo "Thock ${GITHUB_REF_NAME} is live on the stable channel." >> "$GITHUB_STEP_SUMMARY"

      # The manifest's notes_url points at this release, and a draft is a 404
      # for everyone but the owner.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
