name: Release

# Builds the distributable Thock binaries.
#
#   * `workflow_dispatch` — build only; the bundles land as run artifacts,
#     which is how you smoke-test a change to the bundling scripts.
#   * pushing a `v*` tag — build, then publish a draft GitHub Release holding
#     the same bundles, ready to be attached to the download page.
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Nothing downstream symbolicates these builds, and the debug info alone
  # exceeds the free space on a hosted runner.
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  macos:
    name: macOS (aarch64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
          cache-all-crates: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Unsigned: `script/bundle-mac` falls back to an ad-hoc signature when the
      # Apple secrets are absent. Add MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD,
      # APPLE_NOTARIZATION_KEY, APPLE_NOTARIZATION_KEY_ID and
      # APPLE_NOTARIZATION_ISSUER_ID as repository secrets to get a signed,
      # notarized DMG that opens without a Gatekeeper warning.
      - name: Bundle
        run: script/bundle-mac aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: thock-macos-aarch64
          path: target/aarch64-apple-darwin/release/Thock-aarch64.dmg
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: .github/scripts/free-disk-space.sh

      - name: Install Linux dependencies
        run: script/linux

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
          cache-all-crates: true

      # Ubuntu's `llvm` package installs versioned binaries; `script/bundle-linux`
      # calls the unversioned name.
      - name: Ensure llvm-objcopy is on PATH
        run: |
          if ! command -v llvm-objcopy >/dev/null; then
            objcopy_path="$(ls -1 /usr/lib/llvm-*/bin/llvm-objcopy | sort -V | tail -1)"
            sudo ln -sf "$objcopy_path" /usr/local/bin/llvm-objcopy
          fi
          llvm-objcopy --version

      - name: Bundle
        run: script/bundle-linux

      - uses: actions/upload-artifact@v4
        with:
          name: thock-linux-x86_64
          path: |
            target/release/thock-linux-x86_64.tar.gz
            target/thock-remote-server-linux-x86_64.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Drafted rather than published so the download page is updated first.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Thock ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
