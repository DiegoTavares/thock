name: CI

# One job per Thock suite, each started only when the change touches what it
# covers. `thock/script/test` holds the path → suite mapping, so CI and a local
# run agree on what a change needs. See `thock/TESTING.md`.
#
# macOS runners cost ten times a Linux minute, so the macOS Rust test job runs
# on main and on pull requests labelled `needs-mac`, not on every pull request.
# The iPhone and sync-integration jobs have no Linux equivalent; they keep
# running on the pull requests whose paths need them.
on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Debug info dominates the target directory and blows past both the runner
  # disk and the 10 GB Actions cache limit. CI never symbolicates.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      go_modules: ${{ steps.plan.outputs.go_modules }}
      test_os: ${{ steps.plan.outputs.test_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull request runs the suites its files map to; main and manual runs
      # run everything, so a wrong mapping can't hide a failure for long.
      - name: Choose suites
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEEDS_MAC: ${{ contains(github.event.pull_request.labels.*.name, 'needs-mac') }}
        run: |
          # Called through a variable: shellcheck reads a command named
          # `test` as the builtin and misparses its arguments.
          plan=thock/script/test
          if [ -n "${PR_NUMBER}" ]; then
            suites="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
              | "${plan}" --paths-from - --plan)"
          else
            suites="$("${plan}" --all --plan)"
          fi
          echo "${suites}"
          echo "suites=$(jq -cnR '[inputs | select(length > 0)]' <<< "${suites}")" >> "$GITHUB_OUTPUT"
          echo "go_modules=$(jq -cnR '[inputs | select(startswith("go-")) | ltrimstr("go-")]' <<< "${suites}")" >> "$GITHUB_OUTPUT"
          if [ -z "${PR_NUMBER}" ] || [ "${NEEDS_MAC}" = "true" ]; then
            echo 'test_os=["ubuntu-latest", "macos-15"]' >> "$GITHUB_OUTPUT"
          else
            echo 'test_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  style:
    name: Style
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'rust') || contains(fromJSON(needs.plan.outputs.suites), 'sync-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Check keymaps
        run: script/check-keymaps

  clippy:
    name: Clippy
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'rust') || contains(fromJSON(needs.plan.outputs.suites), 'sync-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: .github/scripts/free-disk-space.sh

      - name: Install Linux dependencies
        run: script/linux

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy
          cache-all-crates: true

      # Thock lives in `crates/thock` and `crates/thock-sync-core`; `crates/zed`
      # is the only upstream crate the fork registers into, so together they
      # cover the whole delta.
      - name: cargo clippy
        run: cargo clippy -p thock -p thock_sync_core -p zed --all-targets -- --deny warnings

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'rust') || contains(fromJSON(needs.plan.outputs.suites), 'sync-core')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.test_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        run: .github/scripts/free-disk-space.sh

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: script/linux

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-${{ matrix.os }}
          cache-all-crates: true

      - name: cargo nextest
        run: cargo nextest run -p thock -p thock_sync_core --no-fail-fast --failure-output immediate-final

  go:
    name: Go (${{ matrix.module }})
    needs: plan
    if: needs.plan.outputs.go_modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.go_modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate the module
        id: module
        env:
          MODULE: ${{ matrix.module }}
        run: |
          case "${MODULE}" in
            site) echo "dir=thock/site" >> "$GITHUB_OUTPUT" ;;
            *) echo "dir=thock/services/${MODULE}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.module.outputs.dir }}/go.mod
          cache-dependency-path: ${{ steps.module.outputs.dir }}/go.sum

      - name: gofmt
        working-directory: ${{ steps.module.outputs.dir }}
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "${unformatted}" ] || { echo "gofmt needed on:"; echo "${unformatted}"; exit 1; }

      - name: staticcheck
        working-directory: ${{ steps.module.outputs.dir }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      # The same command a local run uses; the plus suite starts its own
      # embedded Postgres, so no service container is needed.
      - name: Test
        env:
          MODULE: ${{ matrix.module }}
        run: thock/script/test "go-${MODULE}"

      - name: Test with the race detector
        working-directory: ${{ steps.module.outputs.dir }}
        run: go test -race ./...

      # Reports only vulnerabilities in code the module actually calls.
      - name: govulncheck
        working-directory: ${{ steps.module.outputs.dir }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  ios:
    name: iPhone
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'ios')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ThockKit unit tests
        run: thock/ios/script/test

      - name: Build, launch and drive the app on a simulator
        run: thock/ios/script/smoke

  # The real desk and phone sync clients against a real Plus server. On macOS
  # because the phone half needs the Keychain; the server brings its own
  # Postgres. Shares the macOS test job's build cache.
  integration:
    name: Sync integration
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'integration')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: thock/services/plus/go.mod
          cache-dependency-path: thock/services/plus/go.sum

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test-macos-15
          cache-all-crates: true
          save-if: false

      - name: Desk and phone against the Plus server
        run: thock/script/integration

  workflows:
    name: Workflows
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.suites), 'workflows')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pipx install zizmor==1.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows and scripts
        run: thock/script/lint-workflows

  # The one check branch protection requires. A suite the plan skipped counts
  # as passing; a failed or cancelled one does not.
  ci:
    name: CI
    if: always()
    needs: [plan, style, clippy, test, go, ios, integration, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "${FAILED}" = "true" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
