name: Report a bug
description: Something in Thock isn't working, including crashes and freezes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Your vault is private. **Never paste note contents**, vault paths you'd rather keep private, or anything from your notes into this issue. Describe the shape of the problem instead (for example "a note with a table under a heading").
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Screenshots or a short video help. For a crash or freeze, say what you were doing when it happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Day Planner
        2. Press ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Thock version
      description: >-
        On the desktop, open **About Thock** from the app menu (or run `zed: about` from the command palette) and press **Copy**.
        On iPhone, use the version shown on Thock's App Store page or in TestFlight.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - iPhone
    validations:
      required: true
