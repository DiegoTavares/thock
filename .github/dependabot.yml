# Thock's own dependency surfaces only. The Cargo workspace is inherited from
# Zed; its bumps arrive through the upstream review (security ones first), not
# through Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /thock/services/plus
      - /thock/services/releases
      - /thock/site
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

